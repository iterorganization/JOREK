[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jorek-equation-codegen"
version = "0.1.0"
description = "Symbolic weak-form linearization for JOREK equations"
requires-python = ">=3.9"
dependencies = ["sympy>=1.12,<2"]

[tool.setuptools.packages.find]
where = ["src"]

